name: Website

# Builds the website and checks that it still matches the app requirements.
# Run it by hand: Actions tab > Website > Run workflow.
# It also runs on every push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: web
    env:
      # Firebase web settings are public by design; the database rules protect the data.
      # Add them in GitHub: Settings > Secrets and variables > Actions > Variables tab.
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL || secrets.VITE_FIREBASE_DATABASE_URL }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}

      # Giphy for GIF search in the web app.
      # This is still visible in browser JS when shipped to the browser.
      # For a truly secret key, you need a backend proxy.
      VITE_GIPHY_API_KEY: ${{ vars.VITE_GIPHY_API_KEY || secrets.VITE_GIPHY_API_KEY }}

      VITE_UPLOAD_URL: ${{ vars.VITE_UPLOAD_URL || secrets.VITE_UPLOAD_URL }}
      VITE_MAX_UPLOAD_MB: ${{ vars.VITE_MAX_UPLOAD_MB || secrets.VITE_MAX_UPLOAD_MB }}
      VITE_TURN_URL: ${{ vars.VITE_TURN_URL || secrets.VITE_TURN_URL }}
      VITE_TURN_USERNAME: ${{ vars.VITE_TURN_USERNAME || secrets.VITE_TURN_USERNAME }}
      VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL || vars.VITE_TURN_CREDENTIAL }}

      VITE_BASE: ./
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Check that required settings exist
        run: |
          missing=""
          for v in \
            VITE_FIREBASE_API_KEY \
            VITE_FIREBASE_AUTH_DOMAIN \
            VITE_FIREBASE_PROJECT_ID \
            VITE_FIREBASE_DATABASE_URL \
            VITE_FIREBASE_APP_ID
          do
            if [ -z "${!v}" ]; then
              missing="$missing $v"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error title=Missing GitHub Variables::These Variables are empty:$missing . Add them in Settings > Secrets and variables > Actions > Variables tab (not the Secrets tab), then run the workflow again."
            {
              echo "### Missing settings"
              echo "These **Variables** are empty:$missing"
              echo "Add them in **Settings > Secrets and variables > Actions > Variables** (the Variables tab, not Secrets), then click **Run workflow** again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          case "$VITE_FIREBASE_DATABASE_URL" in
            https://*) ;;
            *) echo "::warning title=Database URL::VITE_FIREBASE_DATABASE_URL should start with https://" ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Build the website
        id: build
        run: npx vite build

      - name: Confirm the site is not a PWA
        working-directory: .
        run: bash scripts/check-no-pwa.sh web/dist web/src

      - name: Type-check (report only)
        id: types
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Lint (report only)
        id: lint
        continue-on-error: true
        run: npx eslint src

      - name: Unit tests (report only)
        id: tests
        continue-on-error: true
        run: npx vitest run

      - name: Write a summary
        if: always()
        run: |
          {
            echo "### Website build summary"
            echo
            echo "- Build: ${{ steps.build.outcome || 'skipped' }}"
            echo "- Type-check: ${{ steps.types.outcome || 'skipped' }}"
            echo "- Lint: ${{ steps.lint.outcome || 'skipped' }}"
            echo "- Tests: ${{ steps.tests.outcome || 'skipped' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dailytalk-web-build
          path: web/dist
          if-no-files-found: error
          retention-days: 7
