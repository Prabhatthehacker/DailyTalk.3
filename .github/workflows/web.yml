name: Website

# Builds the website and publishes it to GitHub Pages.
# Run it by hand: Actions tab > Website > Run workflow. It also runs on every push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: web
    env:
      # Firebase web settings are public by design; the database rules protect the data.
      # Add them under Settings > Secrets and variables > Actions > the "Variables" tab.
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_GIPHY_API_KEY: ${{ vars.VITE_GIPHY_API_KEY }}
      VITE_UPLOAD_URL: ${{ vars.VITE_UPLOAD_URL }}
      VITE_MAX_UPLOAD_MB: ${{ vars.VITE_MAX_UPLOAD_MB }}
      VITE_TURN_URL: ${{ vars.VITE_TURN_URL }}
      VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
      VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
      VITE_BASE: ./
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Check that the required settings exist
        run: |
          missing=""
          for v in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_DATABASE_URL VITE_FIREBASE_APP_ID; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing GitHub Variables::These Variables are empty:$missing . Add them in Settings > Secrets and variables > Actions > Variables tab (not the Secrets tab), then run the workflow again."
            {
              echo "### Missing settings"
              echo "These **Variables** are empty:$missing"
              echo "Add them in **Settings > Secrets and variables > Actions > Variables** (the Variables tab, not Secrets), then click **Run workflow** again."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          case "$VITE_FIREBASE_DATABASE_URL" in
            https://*) ;;
            *) echo "::warning title=Database URL::VITE_FIREBASE_DATABASE_URL should start with https://" ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error

      # The build is the only check that must pass. Type errors, lint and tests are reported
      # below but do not stop the site from being published.
      - name: Build the website
        id: build
        run: npx vite build

      - name: Confirm the site is not a PWA
        working-directory: .
        run: bash scripts/check-no-pwa.sh web/dist web/src

      - name: Type-check (report only)
        id: types
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Lint (report only)
        id: lint
        continue-on-error: true
        run: npx eslint src

      - name: Unit tests (report only)
        id: tests
        continue-on-error: true
        run: npx vitest run

      - name: Write a summary
        if: always()
        run: |
          {
            echo "### Website build"
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo "| Type-check | ${{ steps.types.outcome }} |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| Unit tests | ${{ steps.tests.outcome }} |"
            echo ""
            echo "Type-check, lint and tests only report problems. If one says failure, open that step and copy the red lines to Claude."
            if [ "${{ vars.DEPLOY_PAGES }}" != "true" ]; then
              echo ""
              echo "**The site was NOT published** because the Variable DEPLOY_PAGES is not set to true."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    # Publishes only from the repository's main branch and only when the Variable DEPLOY_PAGES is "true".
    # Settings > Pages > Source must be "GitHub Actions".
    if: ${{ github.ref_name == github.event.repository.default_branch && vars.DEPLOY_PAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  rules:
    name: Database rules tests (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A failure here never turns the whole run red and never blocks publishing.
    continue-on-error: true
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Run the rules tests in the Realtime Database emulator
        run: npx firebase emulators:exec --config ../firebase.json --only database --project demo-dailytalk "npx vitest run"
        
