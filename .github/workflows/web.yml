name: Website

on:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'scripts/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Firebase web config is public by design; access is enforced by security rules.
      # Set these under Settings > Secrets and variables > Actions > Variables.
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_GIPHY_API_KEY: ${{ vars.VITE_GIPHY_API_KEY }}
      VITE_UPLOAD_URL: ${{ vars.VITE_UPLOAD_URL }}
      VITE_MAX_UPLOAD_MB: ${{ vars.VITE_MAX_UPLOAD_MB }}
      VITE_TURN_URL: ${{ vars.VITE_TURN_URL }}
      VITE_TURN_USERNAME: ${{ secrets.VITE_TURN_USERNAME }}
      VITE_TURN_CREDENTIAL: ${{ secrets.VITE_TURN_CREDENTIAL }}
      VITE_BASE: ./
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Confirm the site is not a PWA
        working-directory: .
        run: scripts/check-no-pwa.sh web/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  rules:
    name: Database rules tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --no-audit --no-fund
      - name: Run rules tests in the Realtime Database emulator
        run: npx firebase emulators:exec --config ../firebase.json --only database --project demo-dailytalk "npx vitest run"

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Runs only on main and only when the repository variable DEPLOY_PAGES is "true"
    # (and Pages > Source is set to "GitHub Actions").
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
