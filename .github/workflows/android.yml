name: Android

# Builds the Android app (APK). Run it by hand: Actions tab > Android > Run workflow.
# When it is green, open the run and download "Dailytalk-debug-apk" under Artifacts.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build the debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: android
    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || vars.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || vars.FIREBASE_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL || secrets.FIREBASE_DATABASE_URL }}
      GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY || vars.GIPHY_API_KEY }}
      UPLOAD_URL: ${{ vars.UPLOAD_URL || secrets.UPLOAD_URL }}
      MAX_UPLOAD_MB: ${{ vars.MAX_UPLOAD_MB || secrets.MAX_UPLOAD_MB }}
      TURN_URL: ${{ vars.TURN_URL || secrets.TURN_URL }}
      TURN_USERNAME: ${{ secrets.TURN_USERNAME || vars.TURN_USERNAME }}
      TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL || vars.TURN_CREDENTIAL }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Check that the required settings exist
        run: |
          missing=""
          for v in FIREBASE_API_KEY FIREBASE_APP_ID FIREBASE_PROJECT_ID FIREBASE_DATABASE_URL; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing GitHub settings::These are empty:$missing . FIREBASE_API_KEY and FIREBASE_APP_ID go in the Secrets tab; FIREBASE_PROJECT_ID and FIREBASE_DATABASE_URL go in the Variables tab (Settings > Secrets and variables > Actions)."
            {
              echo "### Missing settings"
              echo "These are empty:$missing"
              echo "**Secrets tab:** FIREBASE_API_KEY, FIREBASE_APP_ID. **Variables tab:** FIREBASE_PROJECT_ID, FIREBASE_DATABASE_URL."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # Gradle itself is installed by this step, so no wrapper files are needed in the repository.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Show tool versions
        run: |
          java -version
          gradle --version

      - name: Unit tests (report only)
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest 2>&1 | tee "$GITHUB_WORKSPACE/test.log"

      - name: Build the debug APK
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show the build errors in the summary
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        run: |
          {
            echo "### The Android build failed"
            echo "Copy the lines below and paste them to Claude, together with the file name shown after \`e:\`."
            echo '```'
            grep -E "^e: |error:|What went wrong|Execution failed|Could not resolve|Unresolved reference" -A2 "$GITHUB_WORKSPACE/build.log" | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the full logs and reports when something failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs
          path: |
            build.log
            test.log
            android/app/build/reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Find the APK
        id: apk
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "path=android/$apk" >> "$GITHUB_OUTPUT"
          {
            echo "### Android build finished"
            echo "Unit tests: ${{ steps.tests.outcome }} (report only)"
            echo "Download **Dailytalk-debug-apk** from the Artifacts section at the bottom of this run's page."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Dailytalk-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
